name: Release

on:
  # 推送到 main 分支自动触发，版本号 = 提交时间
  push:
    branches: [main]
  # 手动触发（版本号同样取最后一次提交的时间）
  workflow_dispatch:

# 防止多次 push 的构建同时进行，互相抢 Release
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # 用于创建 GitHub Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod   # 自动按 go.mod 里的版本装 Go
          cache: true               # 缓存依赖，加速后续构建

      # 版本号 = HEAD 提交的时间（保留提交者时区），格式 20260818-1842
      - name: Resolve version from commit time
        shell: pwsh
        run: |
          $v = git log -1 --date=format:'%Y%m%d-%H%M' --format=%cd
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($v)) { throw "Failed to read commit time" }
          Write-Host "Version (commit time): $v"
          echo "VERSION=$v" >> $env:GITHUB_ENV

      - name: Run tests
        shell: pwsh
        run: go test ./...

      # 编译独立的 server.exe（不含任何启动脚本）
      - name: Build server.exe
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -buildvcs=false -trimpath -ldflags "-s -w" -o server.exe ./cmd/server
          if ($LASTEXITCODE -ne 0) { throw "go build failed" }

      # 生成校验文件，便于下载后核对完整性
      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash server.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "server.exe.sha256" -Value "$hash  server.exe" -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-windows-amd64-${{ env.VERSION }}
          path: |
            server.exe
            server.exe.sha256
          if-no-files-found: error

      # 创建 Release，tag 名形如 v20260818-1842，附件就是 server.exe 本体
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: server ${{ env.VERSION }}
          files: |
            server.exe
            server.exe.sha256
          generate_release_notes: true
