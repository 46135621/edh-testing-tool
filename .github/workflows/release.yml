name: Release

on:
  # 手动触发：在 Actions 页面点 "Run workflow"，填版本号
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: true
        default: '0.1.0'
  # 打 tag 时自动触发：git tag v0.1.0 && git push origin v0.1.0
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 用于创建 GitHub Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod   # 自动按 go.mod 里的版本装 Go
          cache: true               # 缓存依赖，加速后续构建

      # 确定版本号：tag 触发时取 tag 名（去掉 v 前缀），手动触发时取输入值
      - name: Resolve version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $v = '${{ inputs.version }}'
          }
          Write-Host "Building version: $v"
          echo "VERSION=$v" >> $env:GITHUB_ENV

      # 直接调用你现有的脚本
      - name: Build release package
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\build-release.ps1 -Version $env:VERSION

      # 产物总是上传为 artifact（可从 Actions 页面下载，保留 90 天）
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PowerLevel-windows-amd64-${{ env.VERSION }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

      # 仅在 tag 触发时创建 GitHub Release 并附上 zip
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
